name: Build Armbian for S905D

on:
  workflow_dispatch:
    inputs:
      set_release:
        description: "Select OS Release."
        default: "bookworm"
        type: choice
        options: [bookworm, trixie, resolute, noble]
      kernel_job1:
        description: "Select the job1 kernel versions."
        default: "5.10.y_5.15.y"
        type: string
      kernel_job2_a:
        description: "Select the job2 kernel group A."
        default: "6.1.y_6.6.y"
        type: string
      kernel_job2_b:
        description: "Select the job2 kernel group B."
        default: "6.12.y_6.18.y"
        type: string
      auto_kernel:
        description: "Auto use the latest kernel."
        default: true
        type: boolean
      kernel_repo:
        description: "Set the kernel repository."
        default: "ophub/kernel"
        type: choice
        options: [ophub/kernel]
      kernel_usage:
        description: "Set the tags of the stable kernel."
        default: "stable"
        type: choice
        options: [stable, flippy, beta]
      armbian_fstype:
        description: "Select armbian rootfs type."
        default: "ext4"
        type: choice
        options: [ext4, btrfs]
      builder_name:
        description: "Set Armbian builder signature."
        default: "ophub"
        type: choice
        options: [ophub, angel]
      config_board:
        description: "Set the base Armbian board name."
        default: "odroidn2"
        type: string
      action_commit:
        description: "Set the ophub action baseline commit."
        default: "c708ef8625320abc0a0a983e6b9a0f831fb389d1"
        type: string

env:
  TZ: Etc/UTC

jobs:
  build-base:
    name: Build base for S905D [ ${{ inputs.kernel_job1 || '5.10.y_5.15.y' }} ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate release tag
        id: tag
        run: |
          REL="${{ inputs.set_release || 'bookworm' }}"
          TAG="Armbian_s905d_${REL}_server_$(date -u +'%Y.%m')"
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"

      - name: Initialize base build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"

      - name: Create virtual disk for extended storage
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: insufficient space"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder

      - name: Download Armbian source code
        working-directory: /builder
        run: |
          git clone -q --single-branch --depth=1 --branch=main https://github.com/armbian/build.git build
          ln -sf /builder/build ${{ github.workspace }}/build
          ln -sf /builder/build /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/build 2>/dev/null || true

      - name: Clone and patch ophub action
        run: |
          git clone https://github.com/ophub/amlogic-s9xxx-armbian custom
          cd custom
          git checkout ${{ inputs.action_commit || 'c708ef8625320abc0a0a983e6b9a0f831fb389d1' }}
          git apply --whitespace=nowarn $GITHUB_WORKSPACE/armbian-slim.patch
          ln -sf /builder/build ${{ github.workspace }}/custom/build

      - name: Compile Armbian [ ${{ inputs.set_release || 'bookworm' }} ]
        working-directory: /builder/build
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || true
          config_board="${{ inputs.config_board || 'odroidn2' }}"
          ./compile.sh RELEASE=${{ inputs.set_release || 'bookworm' }} \
                       BOARD=${config_board} BRANCH=current BUILD_MINIMAL=no \
                       BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes \
                       KERNEL_CONFIGURE=no COMPRESS_OUTPUTIMAGE="sha" SHARE_LOG=yes

      - name: Organize output files and reclaim disk space
        working-directory: ${{ github.workspace }}/custom
        run: |
          chmod +x compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh
          bash compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh \
               -v ${{ inputs.set_release || 'bookworm' }} -s true -c true -k true -p arm64
          cd /builder/build/
          rm -rf $(ls . | grep -v "^output$" | xargs) 2>/dev/null || true
          ls -la output/images/

      - name: Upload base image to Release
        uses: ophub/upload-to-releases@main
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          artifacts: /builder/build/output/images/Armbian_*-trunk_*.img.gz
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild for S905D [ ${{ inputs.kernel_job1 || '5.10.y_5.15.y' }} ]
        uses: ./custom
        with:
          build_target: armbian
          armbian_path: build/output/images/Armbian_*-trunk_*.img.gz
          armbian_board: s905d
          armbian_kernel: ${{ inputs.kernel_job1 || '5.10.y_5.15.y' }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ${{ inputs.kernel_repo }}
          kernel_usage: ${{ inputs.kernel_usage }}
          armbian_fstype: ${{ inputs.armbian_fstype }}
          builder_name: ${{ inputs.builder_name || 'ophub' }}

      - name: Upload rebuilt images to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### Armbian for S905D
            - Default username: `root`
            - Default password: `1234`
            - Install command: `armbian-install`
            - Update command: `armbian-update`
            - Kernels: ${{ inputs.kernel_job1 || '5.10.y_5.15.y' }} / ${{ inputs.kernel_job2_a || '6.1.y_6.6.y' }} / ${{ inputs.kernel_job2_b || '6.12.y_6.18.y' }}

  rebuild-kernels:
    name: Rebuild S905D [ ${{ matrix.kernel }} ]
    needs: build-base
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        kernel: ${{ fromJson(format('["{0}","{1}"]', inputs.kernel_job2_a || '6.1.y_6.6.y', inputs.kernel_job2_b || '6.12.y_6.18.y')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize rebuild environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo apt-get clean
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"

      - name: Create virtual disk for extended storage
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: insufficient space"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder

      - name: Download Armbian from Releases
        working-directory: /builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/output/images
          gh release download ${{ needs.build-base.outputs.release_tag }} \
            --repo ${{ github.repository }} \
            --pattern "Armbian_*-trunk_*.img.gz" \
            --dir build/output/images
          ls -la build/output/images/
          ln -sf /builder/build ${{ github.workspace }}/build
          ln -sf /builder/build /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/build

      - name: Rebuild for S905D [ ${{ matrix.kernel }} ]
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/Armbian_*-trunk_*.img.gz
          armbian_board: s905d
          armbian_kernel: ${{ matrix.kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ${{ inputs.kernel_repo }}
          kernel_usage: ${{ inputs.kernel_usage }}
          armbian_fstype: ${{ inputs.armbian_fstype }}
          builder_name: ${{ inputs.builder_name || 'ophub' }}

      - name: Upload kernel images to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ needs.build-base.outputs.release_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### Armbian for S905D
            - Default username: `root`
            - Default password: `1234`
            - Install command: `armbian-install`
            - Update command: `armbian-update`
            - Kernels: ${{ inputs.kernel_job1 || '5.10.y_5.15.y' }} / ${{ inputs.kernel_job2_a || '6.1.y_6.6.y' }} / ${{ inputs.kernel_job2_b || '6.12.y_6.18.y' }}
